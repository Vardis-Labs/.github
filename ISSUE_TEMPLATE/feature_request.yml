name: Feature request
description: Propose an improvement or new capability
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem first. A proposed implementation is welcome, but the problem and expected value are more important.

  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What is difficult, missing, or currently impossible?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired behavior and user experience.
    validations:
      required: true

  - type: textarea
    id: local-first
    attributes:
      label: Local-first and privacy considerations
      description: Explain how this should behave offline, where data should live, and whether external services are required.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe workarounds or other approaches you considered.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add mockups, examples, related issues, or technical notes.

  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: I searched for an existing issue or discussion covering this request.
          required: true
        - label: This request has a clear user or project benefit.
          required: true
